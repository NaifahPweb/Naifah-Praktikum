<!DOCTYPE html>
<html>
<head>
    <title>Formulir Klinik Sehat</title>
</head>
<body>

<h2>Formulir Pendaftaran Pasien Klinik Sehat</h2>

<form action="#" method="post">

    <label>Nama Pasien:</label><br>
    <input type="text" name="nama"><br><br>

    <label>Umur:</label><br>
    <input type="number" name="umur"><br><br>

    <label>Jenis Kelamin:</label><br>
    <input type="radio" name="jk" value="laki-laki"> Laki-Laki<br>
    <input type="radio" name="jk" value="perempuan"> Perempuan<br><br>

    <label>Keluhan:</label><br>
    <textarea name="keluhan" rows="5" cols="50"></textarea><br><br>

    <label>Pilih Poli:</label><br>
    <select name="poli">
        <option value="umum">Poli Umum</option>
        <option value="gigi">Poli Gigi</option>
        <option value="anak">Poli Anak</option>
        <option value="kandungan">Poli Kandungan</option>
    </select>
    <br><br>

    <label>Nomor HP:</label><br>
    <input type="text" name="no_hp"><br><br>

    <input type="submit" value="Kirim">

</form>

</body>
</html>
