<html>
<head>
    <title>Kalkulator Sederhana</title>

    <script language="JavaScript">
        function tambah() {
            var a = parseFloat(document.kalkulator.bil1.value);
            var b = parseFloat(document.kalkulator.bil2.value);
            document.kalkulator.hasil.value = a + b;
        }

        function kurang() {
            var a = parseFloat(document.kalkulator.bil1.value);
            var b = parseFloat(document.kalkulator.bil2.value);
            document.kalkulator.hasil.value = a - b;
        }

        function kali() {
            var a = parseFloat(document.kalkulator.bil1.value);
            var b = parseFloat(document.kalkulator.bil2.value);
            document.kalkulator.hasil.value = a * b;
        }

        function bagi() {
            var a = parseFloat(document.kalkulator.bil1.value);
            var b = parseFloat(document.kalkulator.bil2.value);
            document.kalkulator.hasil.value = a / b;
        }
    </script>

</head>

<body>
    <h2>Kalkulator Sederhana</h2>

    <form name="kalkulator">
        Bilangan 1 : <input type="text" name="bil1"><br><br>
        Bilangan 2 : <input type="text" name="bil2"><br><br>

        <input type="button" value=" + " onclick="tambah()">
        <input type="button" value=" - " onclick="kurang()">
        <input type="button" value=" x " onclick="kali()">
        <input type="button" value=" / " onclick="bagi()"><br><br>

        Hasil : <input type="text" name="hasil">
    </form>

    <br><br>
    <SCRIPT LANGUAGE="JavaScript">
    document.write("Dimodifikasi terakhir pada " + document.lastModified);
    </SCRIPT>

</body>
</html>
