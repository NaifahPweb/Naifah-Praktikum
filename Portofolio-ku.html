<!DOCTYPE html>
<html>
<head>
    <title>Web Portofolio Ku</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            background-color: #342b2d;
            color: white;
            padding: 10px;
            display: flex;
            justify-content: center;
        }

        .navbar div {
            margin: 0 15px;
            padding: 8px 12px;
            background: #444;
            border-radius: 4px;
            display: inline-block;
        }

        .header-image {
            width: 100%;
            height: 200px;
            background-image: url("image/background.jpg");
            background-size: cover;
            background-position: center;
        }

        .container {
            display: flex;
            padding: 20px;
        }

        .sidebar {
            width: 30%;
            padding: 15px;
            background-color: #f7eee9;
            margin-right: 20px;
        }

        .content {
            width: 70%;
        }

        .cards {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .card {
            width: 80px;
            padding: 20px;
            background-color: #ffbb88;
            text-align: center;
            border: 1px solid #faf6f4;
        }

        .footer {
            text-align: center;
            padding: 10px;
            background-color: #333;
            color: white;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    <div class="navbar">
        <div>HOME</div>
        <div>PROFIL</div>
        <div>CONTACT</div>
    </div>

    <div class="header-image"></div>

    <div class="container">

        <div class="sidebar">
            <h3>Tentang Aku</h3>
            <p>
                Kisah Sekolaku Lorem ipsum dolor sit amet, consectetur adipiscing elit.
                Aku anak sederhana yang suka belajar hal baru dan mencoba hal baru.
            </p>
        </div>

        <div class="content">
            <h3>Riwayat Pendidikan</h3>

            <div class="cards">
                <div class="card">SD</div>
                <div class="card">SMP</div>
                <div class="card">SMA</div>
                <div class="card">S1</div>
            </div>
        </div>

    </div>

    <div class="footer">
        Copyright © 2021 moch yusuf asyhari all right reserved
    </div>

</body>
</html>
