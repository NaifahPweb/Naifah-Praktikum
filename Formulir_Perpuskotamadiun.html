<!DOCTYPE html>
<html>
<head>
    <title>Formulir Perpustakaan Kota Madiun</title>
</head>
<body>
    
<h2>Formulir Pendaftaran Anggota Perpustakaan</h2>

<form action="#" method="post">

    <label>Nama Lengkap:</label><br>
    <input type="text" name="nama"><br><br>

    <label>NIK:</label><br>
    <input type="text" name="nik"><br><br>

    <label>Password:</label><br>
    <input type="password" name="password"><br><br>

    <label>Jenis Kelamin:</label><br>
    <input type="radio" name="jk" value="laki-laki"> Laki-Laki<br>
    <input type="radio" name="jk" value="perempuan"> Perempuan<br><br>

    <label>Hobi Membaca:</label><br>
    <input type="checkbox" name="fiksi"> Buku Fiksi<br>
    <input type="checkbox" name="non_fiksi"> Buku Non-Fiksi<br>
    <input type="checkbox" name="komik"> Komik<br><br>

    <label>Asal:</label><br>
    <select name="asal">
        <option value="Kota Madiun">Kota Madiun</option>
        <option value="Kabupaten Madiun">Kabupaten Madiun</option>
        <option value="Kota Ngawi">Kota Ngawi</option>
        <option value="Kabupaten Ngawi">Kabupaten Ngawi</option>
        <option value="Kota Magetan">Kota Magetan</option>
        <option value="Kabupaten Magetan">Kabupaten Magetan</option>
    </select>
    <br><br>

    <label>Alamat:</label><br>
    <textarea name="alamat" rows="4" cols="50"></textarea><br><br>

    <input type="submit" value="Daftar">

</form>

</body>
</html>
